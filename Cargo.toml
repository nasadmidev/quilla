[package]
name = "quilla"
version = "0.2.0"
edition = "2024"

[lib]
name = "quilla"
path = "src/lib.rs"

[[bin]]
name = "quilla"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tar = "0.4.46"
flate2 = "1"
zstd = "0.14.3"
toml = "1.2.1"

[dev-dependencies]
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
