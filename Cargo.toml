[package]
name = "quilla"
version = "0.1.0"
edition = "2024"

[lib]
name = "quilla"
path = "src/lib.rs"

[[bin]]
name = "quilla"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }